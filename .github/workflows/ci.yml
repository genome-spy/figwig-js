name: Verify package
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
permissions:
  contents: read
jobs:
  verify:
    if: github.event.action != 'labeled' || github.event.label.name == 'publish-preview'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.action == 'labeled' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run build
      - run: npm pack --dry-run
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-node-${{ matrix.node }}
          path: test-results/
  publish-preview:
    needs: verify
    if: >-
      github.repository == 'genome-spy/figwig-js' &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && !github.event.deleted) ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
      github.event.label.name == 'publish-preview' &&
      github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check preview label
        id: approval
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { owner, repo } = context.repo
            const branch = context.payload.pull_request?.head.ref ?? context.ref.slice('refs/heads/'.length)
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', head: `${owner}:${branch}`, per_page: 100,
            })
            const approved = pulls.find(pull =>
              pull.head.repo?.full_name === `${owner}/${repo}` &&
              pull.labels.some(label => label.name === 'publish-preview')
            )
            if (approved) {
              core.info(`Preview enabled by the publish-preview label on pull request #${approved.number}.`)
              core.setOutput('approved', 'true')
            } else {
              core.info('No open pull request has the publish-preview label.')
            }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.approval.outputs.approved == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.approval.outputs.approved == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.approval.outputs.approved == 'true'
      - name: Publish preview package
        if: steps.approval.outputs.approved == 'true'
        run: npm exec -- pkg-pr-new publish --previewVersion --comment=off --no-template --no-compact .
